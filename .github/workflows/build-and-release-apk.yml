name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (release or debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      tag_name:
        description: 'Release Tag (leave empty to use existing or default v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: node node_modules/@capacitor/cli/bin/capacitor sync android

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          api-level: 36
          build-tools: 36.0.0
          components: |
            platform-tools
            platforms;android-36
            build-tools;34.0.0
            cmdline-tools;latest
          accept-licenses: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to gradlew
        run: chmod +x android/gradlew

      # Create non-secret Android variables the build expects
      - name: Create android/variables.gradle
        run: |
          mkdir -p "$GITHUB_WORKSPACE/android"
          cat > "$GITHUB_WORKSPACE/android/variables.gradle" <<'EOF'
          ext {
              compileSdkVersion = 36
              targetSdkVersion  = 36
              minSdkVersion     = 24

              androidxAppCompatVersion = "1.7.0"
              androidxCoordinatorLayoutVersion = "1.2.0"
              coreSplashScreenVersion = "1.0.0"
              junitVersion = "4.13.2"
              androidxJunitVersion = "1.1.5"
              androidxEspressoCoreVersion = "3.5.1"
          }
          EOF

      # Create gradle.properties with the signing metadata (passwords and alias are injected from secrets)
      - name: Create android/gradle.properties (signing)
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/android"
          cat > "$GITHUB_WORKSPACE/android/gradle.properties" <<EOF
          org.gradle.jvmargs=-Xmx1536m
          android.useAndroidX=true
          android.enableJetifier=true

          RELEASE_STORE_PASSWORD=${RELEASE_STORE_PASSWORD}
          RELEASE_KEY_ALIAS=${RELEASE_KEY_ALIAS}
          RELEASE_KEY_PASSWORD=${RELEASE_KEY_PASSWORD}
          EOF

      # Restore the keystore from a base64 secret robustly (strips CR/LF and reports clear errors)
      - name: Restore release keystore (from base64)
        env:
          RELEASE_STORE_FILE_B64: ${{ secrets.RELEASE_STORE_FILE_B64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          # If secret not provided, skip (useful for debug/testing)
          if [ -z "${RELEASE_STORE_FILE_B64}" ]; then
            echo "No RELEASE_STORE_FILE_B64 secret set; skipping keystore restore."
            exit 0
          fi

          # Only restore for release builds (avoid failing debug runs)
          if [ "${{ github.event.inputs.build_type }}" != "release" ]; then
            echo "Debug build selected; skipping keystore restoration."
            exit 0
          fi

          echo "Restoring keystore from secret..."
          mkdir -p "$GITHUB_WORKSPACE/android/app"

          CLEAN_B64="$(printf '%s' "$RELEASE_STORE_FILE_B64" | tr -d '\r\n')"

          # Strip accidental surrounding quotes if they were included in the secret value.
          if [ "${CLEAN_B64:0:1}" = '"' ] && [ "${CLEAN_B64: -1}" = '"' ]; then
            CLEAN_B64="${CLEAN_B64:1:${#CLEAN_B64}-2}"
          fi
          if [ "${CLEAN_B64:0:1}" = "'" ] && [ "${CLEAN_B64: -1}" = "'" ]; then
            CLEAN_B64="${CLEAN_B64:1:${#CLEAN_B64}-2}"
          fi

          if ! printf '%s' "$CLEAN_B64" | grep -Eq '^[A-Za-z0-9+/=]+$'; then
            echo "ERROR: RELEASE_STORE_FILE_B64 is malformed. Ensure it is a single-line base64 string of the .keystore file with no quotes or extra whitespace."
            exit 1
          fi

          printf '%s' "$CLEAN_B64" | base64 --decode > "$GITHUB_WORKSPACE/android/app/release.keystore" || {
            echo "ERROR: Keystore base64 decode failed."
            exit 1
          }

          echo "RELEASE_STORE_FILE=app/release.keystore" >> "$GITHUB_WORKSPACE/android/gradle.properties"

      - name: Build APK with Gradle
        run: |
          cd android
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            echo "Building Debug APK..."
            ./gradlew assembleDebug --stacktrace
            APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          else
            echo "Building Release APK..."
            ./gradlew assembleRelease --stacktrace
            APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          fi

          cd ..
          echo "Found APK at: android/$APK_PATH"
          mkdir -p dist-apk
          cp "android/$APK_PATH" "dist-apk/Torres-Capitol-College-SIS.apk"

          # Compute checksums
          cd dist-apk
          sha256sum Torres-Capitol-College-SIS.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Torres-Capitol-College-SIS-APK
          path: dist-apk/Torres-Capitol-College-SIS.apk
          retention-days: 30

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref_name }}" == v* ]]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="v1.0.0-$(date +'%Y%m%d%H%M')"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: "Torres Capitol College SIS ${{ steps.release_tag.outputs.tag }}"
          files: |
            dist-apk/Torres-Capitol-College-SIS.apk
            dist-apk/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 🎓 Torres Capitol College SIS - Android APK Release
            Official manual download release for Torres Capitol College Student Information System.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
